          </div>
          <div class="ca-import-box" style="margin-top:12px">
            <div style="font-family:var(--font-cute);margin-bottom:8px">📝 手动粘贴文章</div>
            <input class="input mb-2" id="caImportTitle" placeholder="文章标题">
            <textarea class="textarea mb-2" id="caImportBody" rows="4" placeholder="粘贴正文内容"></textarea>
            <select class="input" id="caImportCat">${Object.entries(this.cats).map(([id,info])=>`<option value="${id}">${info.emoji} ${info.name}</option>`).join('')}</select>
          </div>
        `, `<button class="btn btn-primary" onclick="app.modules.currentAffairs.importArticle()">导入文章</button><button class="btn btn-ghost" onclick="app.closeModal()">关闭</button>`);
        return;
      }

      // 月度归档
      if (action === 'addMonthly') {
        app.openModal('新增月度归档', `
          <input class="input mb-2" id="mMonth" placeholder="月份 如 2024-07">
          <input class="input mb-2" id="mTitle" placeholder="标题">
          <textarea class="textarea mb-2" id="mContent" placeholder="精简版内容"></textarea>
          <textarea class="textarea" id="mFull" placeholder="完整梳理版内容"></textarea>
        `, `<button class="btn btn-primary" onclick="app.modules.currentAffairs.saveMonthly()">保存</button>`);
        return;
      }
      if (action === 'exportMonthly') {
        const m = ca.monthly.find(x => x.id === el.dataset.id);
        const txt = `${m.month} ${m.title}\n\n精简版：\n${m.content}\n\n完整版：\n${m.full||'暂无'}`;
        this.copyText(txt, '已导出到剪贴板'); return;
      }
      if (action === 'quizMonthly') {
        // 生成3道自测题
        ca._quizQuestions = seedQuiz(3, '月度时政'); ca._quizAnswers = []; ca._quizIdx = 0; ca._quizOn = true; DB.save(); app.switchModule('currentAffairs'); return;
      }
      if (action === 'deleteMonthly') {
        const id = el.closest('[data-id]').dataset.id; ca.monthly = ca.monthly.filter(x => x.id !== id); DB.save(); app.switchModule('currentAffairs'); return;
      }
      if (action === 'editMonthly') {
        const id = el.closest('[data-id]').dataset.id; const m = ca.monthly.find(x => x.id === id);
        app.openModal('编辑月度归档', `
          <input class="input mb-2" id="mMonth" value="${escape(m.month)}">
          <input class="input mb-2" id="mTitle" value="${escape(m.title)}">
          <textarea class="textarea mb-2" id="mContent">${escape(m.content)}</textarea>
          <textarea class="textarea" id="mFull">${escape(m.full||'')}</textarea>

        const id = el.closest('[data-id]').dataset.id;
        const m = ca.meetings.find(x => x.id === id);
        if (m) { m._expanded = !m._expanded; DB.save(); app.switchModule('currentAffairs'); }

      if (action === 'addMeeting') {
        app.openModal('新增会议专题', `
          <input class="input mb-2" id="mtTitle" placeholder="标题">
          <input class="input mb-2" id="mtTags" placeholder="标签，用空格分隔">
          <textarea class="textarea mb-2" id="mtContent" placeholder="核心考点摘要（支持HTML标红）"></textarea>
          <textarea class="textarea mb-2" id="mtFull" placeholder="政策原文/全文解读"></textarea>

        `, `<button class="btn btn-primary" onclick="app.modules.currentAffairs.saveMeeting()">保存</button>`);

      }
      if (action === 'deleteMeeting') {
        const id = el.closest('[data-id]').dataset.id; ca.meetings = ca.meetings.filter(x => x.id !== id); DB.save(); app.switchModule('currentAffairs'); return;
      }
      if (action === 'editMeeting') {
        const id = el.closest('[data-id]').dataset.id; const m = ca.meetings.find(x => x.id === id);
        app.openModal('编辑会议专题', `

        `, `<button class="btn btn-primary" onclick="app.modules.currentAffairs.saveMeetingEdit('${id}')">保存</button>`);
        return;
      }
      if (action === 'jumpGolden') {
        const title = el.dataset.title;
        DB.data.essay.golden.opening.push({id: uuid(), content: title + ' 申论金句', theme: '时政', tags:['时政联动'], level:0, favorite:false, note:''});
        DB.save(); app.toast('已加入申论金句素材库'); return;
      }

      // 刷题
      if (action === 'startDailyQuiz') { ca._quizQuestions = seedQuiz(5, '每日时政'); ca._quizAnswers = []; ca._quizIdx = 0; ca._quizOn = true; ca._quizStart = Date.now(); DB.save(); app.switchModule('currentAffairs'); this.startTimer(); return; }
      if (action === 'startMonthlyQuiz') { ca._quizQuestions = seedQuiz(10, '月度时政'); ca._quizAnswers = []; ca._quizIdx = 0; ca._quizOn = true; ca._quizStart = Date.now(); DB.save(); app.switchModule('currentAffairs'); this.startTimer(); return; }
      if (action === 'startMeetingQuiz') { ca._quizQuestions = seedQuiz(8, '会议专题'); ca._quizAnswers = []; ca._quizIdx = 0; ca._quizOn = true; ca._quizStart = Date.now(); DB.save(); app.switchModule('currentAffairs'); this.startTimer(); return; }
      if (action === 'answerCA') {
        const i = parseInt(el.dataset.i);
        ca._quizAnswers[ca._quizIdx] = i;
        if (i !== ca._quizQuestions[ca._quizIdx].answer) this.addMistake({type:'currentAffairs', title: ca._quizQuestions[ca._quizIdx].q, answer: ca._quizQuestions[ca._quizIdx].options[ca._quizQuestions[ca._quizIdx].answer], note: ca._quizQuestions[ca._quizIdx].tip, reason: '知识点盲区'});
        ca._quizIdx++; DB.save(); app.switchModule('currentAffairs');
        if (ca._quizOn) this.startTimer();
        return;
      }
      if (action === 'retryWrongCA') {
        const wrong = [];
        ca._quizQuestions.forEach((q,i) => { if (q.answer !== ca._quizAnswers[i]) wrong.push({...q}); });
        if (!wrong.length) { app.toast('没有错题'); return; }
        ca._quizQuestions = wrong; ca._quizAnswers = []; ca._quizIdx = 0; DB.save(); app.switchModule('currentAffairs'); this.startTimer(); return;
      }

      // 背诵
      if (action === 'addRecite') {
        app.openModal('新增背诵考点', `<input class="input mb-2" id="rTitle" placeholder="考点名称"><textarea class="textarea" id="rContent" placeholder="内容"></textarea>`, `<button class="btn btn-primary" onclick="app.modules.currentAffairs.saveRecite()">保存</button>`);
        return;
      }
      if (action === 'masterRecite' || action === 'confuseRecite' || action === 'unmasterRecite' || action === 'deleteRecite') {
        const id = el.closest('[data-id]').dataset.id;
        const lists = {pending: ca.recite.pending, mastered: ca.recite.mastered, confused: ca.recite.confused};
        let item = null, from = '';
        for (const k in lists) { const idx = lists[k].findIndex(x => x.id === id); if (idx > -1) { item = lists[k].splice(idx,1)[0]; from = k; break; } }
        if (action === 'masterRecite') ca.recite.mastered.push(item);
        else if (action === 'confuseRecite') ca.recite.confused.push(item);
        else if (action === 'unmasterRecite') ca.recite.pending.push(item);
        DB.save(); app.switchModule('currentAffairs'); return;
      }
      if (action === 'reviewRecite') {
        const today = ca.recite.pending.slice(0, 3);
        if (!today.length) { app.toast('今日无待复习内容'); return; }
        app.openModal('今日复习', today.map(t => `<p><b>${escape(t.title)}</b><br><span class="text-sm">${escape(t.content)}</span></p>`).join(''), `<button class="btn btn-primary" onclick="app.closeModal()">完成</button>`);
        return;
      }
    },

      DB.data.currentAffairs.items.unshift({

    async fetchRSS() {
      const url = $('#caFeedUrl').value.trim();
      if (!url) { app.toast('请输入 RSS 链接'); return; }
      DB.data.currentAffairs._feedUrl = url; DB.save();
      const out = $('#caFeedResult');
      out.innerHTML = '<div style="color:var(--text-light)">⏳ 正在尝试获取，请稍候...</div>';
      try {
        const proxies = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];
        let text = '';
        for (const proxy of proxies) {
          try {
            const res = await fetch(proxy, {mode:'cors'});
            if (res.ok) { text = await res.text(); break; }
          } catch(e) {}
        }
        if (!text) { out.innerHTML = '<div style="color:#FF6B6B">❌ 无法获取该链接，可能是官媒未开放跨域 RSS，请使用手动导入。</div>'; return; }
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        const items = Array.from(xml.querySelectorAll('item, entry')).slice(0, 8);
        if (!items.length) { out.innerHTML = '<div style="color:#FF6B6B">❌ 未解析到文章条目。</div>'; return; }
        out.innerHTML = items.map((it, i) => {
          const t = it.querySelector('title')?.textContent || '无标题';
          const l = it.querySelector('link')?.textContent || it.querySelector('link')?.getAttribute('href') || '';
          return `<div style="padding:8px;background:rgba(255,255,255,0.7);border-radius:10px;margin-bottom:6px">
            <div style="font-weight:700;font-size:13px">${escape(t)}</div>
            <button class="btn btn-primary btn-sm" style="margin-top:4px" onclick="app.modules.currentAffairs.importRSSItem(${i})">导入此条</button>
          </div>`;
        }).join('');
        this._rssItems = items;
      } catch(e) {
        out.innerHTML = '<div style="color:#FF6B6B">❌ 解析失败：' + escape(e.message) + '</div>';
      }
    },
    importRSSItem(idx) {
      const it = (this._rssItems || [])[idx];
      if (!it) return;
      const title = it.querySelector('title')?.textContent || '无标题';
      const link = it.querySelector('link')?.textContent || it.querySelector('link')?.getAttribute('href') || '';
      const desc = it.querySelector('description, summary, content')?.textContent || '';
      const body = desc ? desc.replace(/<[^>]+>/g, ' ').trim() : link;
      const excerpt = body.length > 120 ? body.slice(0, 120) + '…' : body;
      const cat = $('#caImportCat')?.value || 'daily';
      DB.data.currentAffairs.items.unshift({
        id: uuid(), cat, title, content: excerpt, full: body.replace(/\n/g, '<br>') + (link ? `<br><br><a href="${escape(link)}" target="_blank" style="color:var(--accent-blue)">查看原文 →</a>` : ''),
        date: fmtDate(), read: false, favorite: false, highlight: '', note: ''
      });
      DB.save(); app.closeModal(); app.switchModule('currentAffairs'); app.toast('已导入 RSS 条目');
    },
    copyText(txt, msg) {
      navigator.clipboard ? navigator.clipboard.writeText(txt).then(()=>app.toast(msg)) : app.toast('请长按复制');
    },
    addMistake(m) {
      DB.data.mistakes.aptitude.unshift(Object.assign({id: uuid(), date: fmtDate(), module: '时政常识', level: 0, history: []}, m));

    startTimer() {
      const el = $('#caTimer'); if (!el) return;
      const start = DB.data.currentAffairs._quizStart;
      clearInterval(this._t);
      this._t = setInterval(() => {
        if (!DB.data.currentAffairs._quizOn) { clearInterval(this._t); return; }
        const sec = Math.floor((Date.now() - start)/1000);
        const m = String(Math.floor(sec/60)).padStart(2,'0'), s = String(sec%60).padStart(2,'0');
        const e = $('#caTimer'); if (e) e.textContent = `${m}:${s}`;
      }, 1000);

  function seedQuiz(n, type) {
    const pool = [
      {q:'党的二十届三中全会主题是？', options:['全面从严治党','进一步全面深化改革','生态文明建设','国防现代化'], answer:1, tip:'主题是进一步全面深化改革、推进中国式现代化。'},
      {q:'“新质生产力”的核心标志是？', options:['劳动力数量','全要素生产率大幅提升','资本投入','资源消耗'], answer:1, tip:'全要素生产率大幅提升是新质生产力的核心标志。'},
      {q:'安徽省“三地一区”不包括？', options:['科技创新策源地','新兴产业聚集地','改革开放新高地','自由贸易港'], answer:3, tip:'安徽要打造“三地一区”，不是自由贸易港。'},
      {q:'中央一号文件持续关注的重点是？', options:['乡村振兴','对外开放','国企改革','金融安全'], answer:0, tip:'中央一号文件长期聚焦“三农”与乡村振兴。'},
      {q:'2024年政府工作首要任务是？', options:['大力推进现代化产业体系建设','扩大内需','防范风险','改善民生'], answer:0, tip:'大力推进现代化产业体系建设，加快发展新质生产力。'}
    ];
    const arr = []; for (let i=0;i<n;i++) arr.push({...pool[i%pool.length], type});
    return arr;
  }

      });
      const bindSearch = (id, key) => {
        const el = $(id); if (!el) return;
        el.oninput = e => { es[key] = e.target.value; DB.save(); this.filterActive(); };
        if (es[key]) this.filterActive();
      };
      bindSearch('#normSearch','_q'); bindSearch('#hotSearch','_hq'); bindSearch('#gSearch','_gq');
    },
    detectTab() {
      const es = DB.data.essay;
      if (Object.keys(this.normCats).includes(es.subTab)) return 'normWords';
      if (Object.keys(this.hotCats).includes(es.subTab)) return 'hotWords';
      return 'golden';
    },
    filterActive() {
      const es = DB.data.essay;
      if (es.tab === 'normWords') {
        const q = (es._q||'').toLowerCase();
        $$('#normList .item-card').forEach(c => c.style.display = c.textContent.toLowerCase().includes(q)?'block':'none');

            <p><b>空间重构：</b>相对面不相邻，公共边/点法排除。</p>
          </div>
        </div>
      `;
    },
    renderIdiom() {
      const ap = DB.data.aptitude; const sub = ap.subTab || 'top150';
      let list = ap.questions.idiom;
      if (sub === 'confuse') list = list.filter(x => x.group);
      if (sub === 'error') list = list.filter(x => x.freq >= 8);
      if (sub === 'fav') list = list.filter(x => x.favorite);
      if (sub === 'checklist') list = list.filter(x => x.level < 2);
      return `
        <div class="section-title">🧮 行测专项训练场 <small>安徽考情专属高频成语</small></div>
        <div class="card">
          <div class="flex gap-2 mb-3">
            <button class="btn btn-ghost btn-sm" data-action="backAptHome">← 返回首页</button>
          </div>
          ${app.tabs(Object.entries(this.idiomTabs).map(([id,name])=>({id,name})), sub)}
          <div class="idiom-search-zone">
            <div class="idiom-search-title">🔍 成语小侦探</div>
            <div class="idiom-search-box">
              <input id="idiomSearch" class="idiom-search-input" placeholder="输入成语，快速查找..." value="${ap._iq||''}">
              <button class="idiom-search-btn" data-action="searchIdiomWeb" title="去人民网搜索">📰</button>
            </div>
            <div class="idiom-search-tip">搜不到？点击 📰 去人民网看看更多权威例句~</div>
          </div>
          <div class="flex gap-2 mb-2">
            <button class="btn btn-primary btn-sm" data-action="addIdiom">+ 新增成语</button>
          </div>
          <div class="grid-2" id="idiomList">
            ${list.map(it => this.idiomCard(it)).join('')}
          </div>
        </div>
      `;
    },
    idiomCard(it) {
      const levels = ['陌生','眼熟','熟练'];
      const sents = Array.isArray(it.sentences) ? it.sentences : (it.sentence ? [it.sentence] : []);
      const sentHtml = sents.map((s,i) => `<div class="idiom-sentence">${i+1}. ${escape(s)}</div>`).join('');
      return `<div class="item-card idiom-card ${it.favorite?'idiom-fav':''}" data-id="${it.id}">
        <div class="idiom-card-top">
          <span class="idiom-word">${escape(it.word)}</span>
          <span class="star-btn ${it.favorite?'active':''}" data-action="favIdiom">★</span>
          <span class="tag tag-orange idiom-freq">📚 近5年考${it.freq}次</span>
        </div>
        <div class="idiom-meaning"><b>🌱 释义：</b>${escape(it.meaning)}</div>
        ${it.group ? `<div class="idiom-group"><span class="idiom-group-tag">🧩 易混辨析</span>${escape(it.group)}</div>` : ''}
        <div class="idiom-sentences">
          <div class="idiom-sentences-title">📝 真题语境例句</div>
          ${sentHtml || '<div class="idiom-sentence">暂无例句</div>'}
        </div>
        <div class="item-actions">
          <span class="tag ${['tag-red','tag-orange','tag-green'][it.level]}">${levels[it.level]}</span>
          <button class="btn btn-ghost btn-sm" data-action="levelIdiom" data-l="0">陌生</button>
          <button class="btn btn-ghost btn-sm" data-action="levelIdiom" data-l="1">眼熟</button>
          <button class="btn btn-ghost btn-sm" data-action="levelIdiom" data-l="2">熟练</button>
          <button class="btn btn-ghost btn-sm" data-action="editIdiom">编辑</button>
          <button class="btn btn-ghost btn-sm" data-action="searchIdiomWeb" title="去人民网搜索">📰 人民网</button>
          <button class="btn btn-danger btn-sm" data-action="deleteIdiom">删除</button>
        </div>
      </div>`;
    },

    afterRender() {
      const ap = DB.data.aptitude;
      $$('[data-module="aptitude"] .tab').forEach(t => t.onclick = () => {
        ap.subTab = t.dataset.tab; DB.save(); app.switchModule('aptitude');
      });
      const s = $('#idiomSearch');
      if (s) {
        s.oninput = e => { ap._iq = e.target.value; DB.save(); this.filterIdiom(); };
        if (ap._iq) this.filterIdiom();
      }
      this.startAnyTimer();
    },
    filterIdiom() {
      const q = (DB.data.aptitude._iq || '').toLowerCase();
      $$('#idiomList .item-card').forEach(c => c.style.display = c.textContent.toLowerCase().includes(q) ? 'block' : 'none');
    },
    handle(action, el) {
      const ap = DB.data.aptitude;
      if (action === 'switchTab') return;
      if (action === 'switchAptTab') { ap.tab = el.dataset.tab; ap.subTab = null; DB.save(); app.switchModule('aptitude'); return; }
      if (action === 'backAptHome') { ap.tab = 'home'; ap._calcOn = false; DB.save(); app.switchModule('aptitude'); return; }

      // 资料分析
      if (action === 'startCalc') {
        const count = parseInt($('#calcCount').value) || 5;
        ap._calcQuestions = ap.questions.calc.slice(0, count);
        ap._calcAnswers = []; ap._calcIdx = 0; ap._calcOn = true; ap._calcStart = Date.now();
        DB.save(); app.switchModule('aptitude'); this.startAnyTimer(); return;
      }
      if (action === 'answerCalc') {
        const i = parseInt(el.dataset.i), idx = ap._calcIdx, q = ap._calcQuestions[idx];
        ap._calcAnswers[idx] = i; const correct = i === q.answer;
        if (!correct) this.addMistake({module:'资料分析', title: q.q, answer: q.options[q.answer], note: q.tip, reason:'计算失误'});
        ap._calcIdx++; this.finishIfDone('calc'); return;
      }
      if (action === 'showBaihua') {
        app.openModal('百化分对照表', `<p>1/2=50%  1/3≈33.3%  1/4=25%  1/5=20%</p><p>1/6≈16.7%  1/7≈14.3%  1/8=12.5%  1/9≈11.1%</p><p>1/10=10%  1/11≈9.1%  1/12≈8.3%  1/13≈7.7%</p>`, `<button class="btn btn-primary" onclick="app.closeModal()">关闭</button>`); return;
      }
      if (action === 'draftCalc') {
        app.openModal('草稿模式', `<textarea class="textarea" id="draftArea" placeholder="在此书写计算过程..."></textarea>`, `<button class="btn btn-primary" onclick="app.closeModal()">保存</button>`); return;
      }

      // 图推 / 逻辑 / 加强削弱 统一跳转粉笔APP
      if (action === 'openFenbiApp') {
        const scheme = 'fenbi://';
        const webUrl = 'https://www.fenbi.com';
        const hiddenAtStart = document.hidden;
        window.location.href = scheme;
        setTimeout(() => {
          if (document.hidden === hiddenAtStart) {
            window.location.href = webUrl;
          }
        }, 1500);
        return;
      }
      // 成语
      if (action === 'searchIdiomWeb') {
        let word;
        if (el && el.closest && el.closest('[data-id]')) {
          const id = el.closest('[data-id]').dataset.id;
          word = ap.questions.idiom.find(x => x.id === id)?.word;
        }
        if (!word) word = $('#idiomSearch')?.value?.trim();
        if (!word) { app.toast('请先输入或选择一个成语'); return; }
        const url = 'http://search.people.com.cn/cnpeople/search.do?pageNum=1&keyword=' + encodeURIComponent(word) + '&siteName=news.people.com.cn';
        window.open(url, '_blank');
        return;
      }
      if (action === 'addIdiom') {
        app.openModal('新增成语', `
          <input class="input mb-2" id="iWord" placeholder="成语">
          <textarea class="textarea mb-2" id="iMean" placeholder="释义"></textarea>
          <textarea class="textarea mb-2" id="iSent1" placeholder="例句一"></textarea>
          <textarea class="textarea mb-2" id="iSent2" placeholder="例句二"></textarea>
          <textarea class="textarea mb-2" id="iSent3" placeholder="例句三"></textarea>
          <input class="input mb-2" id="iGroup" placeholder="易混辨析组（如：鬼斧神工/巧夺天工）">
          <input class="input" id="iFreq" type="number" value="1" placeholder="考察频次">
        `, `<button class="btn btn-primary" onclick="app.modules.aptitude.saveIdiom()">保存</button>`); return;
      }
      if (action === 'editIdiom') {
        const id = el.closest('[data-id]').dataset.id; const it = ap.questions.idiom.find(x => x.id === id);
        const sents = Array.isArray(it.sentences) ? it.sentences : (it.sentence ? [it.sentence,'',''] : ['','','']);
        app.openModal('编辑成语', `
          <input class="input mb-2" id="iWord" value="${escape(it.word)}">
          <textarea class="textarea mb-2" id="iMean">${escape(it.meaning)}</textarea>
          <textarea class="textarea mb-2" id="iSent1">${escape(sents[0]||'')}</textarea>
          <textarea class="textarea mb-2" id="iSent2">${escape(sents[1]||'')}</textarea>
          <textarea class="textarea mb-2" id="iSent3">${escape(sents[2]||'')}</textarea>
          <input class="input mb-2" id="iGroup" value="${escape(it.group||'')}">
          <input class="input" id="iFreq" type="number" value="${it.freq}">
        `, `<button class="btn btn-primary" onclick="app.modules.aptitude.saveIdiomEdit('${id}')">保存</button>`); return;
      }
      if (action === 'deleteIdiom') { const id = el.closest('[data-id]').dataset.id; ap.questions.idiom = ap.questions.idiom.filter(x => x.id !== id); DB.save(); app.switchModule('aptitude'); return; }
      if (action === 'levelIdiom') { const id = el.closest('[data-id]').dataset.id; const it = ap.questions.idiom.find(x => x.id === id); it.level = parseInt(el.dataset.l); DB.save(); app.switchModule('aptitude'); return; }
      if (action === 'favIdiom') { const id = el.closest('[data-id]').dataset.id; const it = ap.questions.idiom.find(x => x.id === id); it.favorite = !it.favorite; DB.save(); app.switchModule('aptitude'); return; }

    },
    saveIdiom() {
      const sentences = [$('#iSent1').value,$('#iSent2').value,$('#iSent3').value].filter(Boolean);
      DB.data.aptitude.questions.idiom.push({
        id: uuid(), word: $('#iWord').value, meaning: $('#iMean').value, sentences,
        group: $('#iGroup').value, freq: parseInt($('#iFreq').value)||1, level: 0, favorite: false, note: ''
      }); DB.save(); app.closeModal(); app.switchModule('aptitude');
    },
    saveIdiomEdit(id) {
      const it = DB.data.aptitude.questions.idiom.find(x => x.id === id);
      it.word = $('#iWord').value; it.meaning = $('#iMean').value;
      it.sentences = [$('#iSent1').value,$('#iSent2').value,$('#iSent3').value].filter(Boolean);
      delete it.sentence;
      it.group = $('#iGroup').value; it.freq = parseInt($('#iFreq').value)||1;
      DB.save(); app.closeModal(); app.switchModule('aptitude');
    },
    addMistake(m) {
      DB.data.mistakes.aptitude.unshift(Object.assign({id: uuid(), date: fmtDate(), level: 0, history: []}, m));
      DB.save();
    },
    finishIfDone() {
      const ap = DB.data.aptitude;
      if (ap._calcIdx >= ap._calcQuestions.length) {
        const correct = ap._calcQuestions.filter((q,i) => q.answer === ap._calcAnswers[i]).length;
        const sec = Math.floor((Date.now() - ap._calcStart)/1000);
        ap.calcHistory.push({date: fmtDate(), correct, total: ap._calcQuestions.length, sec});
        ap._calcOn = false; DB.save(); app.switchModule('aptitude');
        app.toast(`完成！答对 ${correct}/${ap._calcQuestions.length}`);
      } else { DB.save(); app.switchModule('aptitude'); this.startAnyTimer(); }
    },
    statsHtml(history, name) {
      if (!history.length) return '<div class="empty-state mt-2"><div class="emoji">📈</div>暂无练习记录</div>';
      const last = history.slice(-5);
      const avg = Math.round(history.reduce((s,h)=>s+h.correct/h.total,0)/history.length*100);
      return `<div class="mt-3"><div class="text-sm text-light">${name} 平均正确率：<b>${avg}%</b>（近${history.length}次）</div><div class="bar-chart" style="height:80px;margin-top:8px">${last.map(h => `<div class="bar-col"><div class="bar" style="height:${clamp(h.correct/h.total*100,5,100)}%"></div><div class="bar-label">${h.date.slice(5)}</div></div>`).join('')}</div></div>`;
    },
    startAnyTimer() {
      const ap = DB.data.aptitude; clearInterval(this._timer);
      if (!ap._calcOn) return;
      this._timer = setInterval(() => {
        const sec = Math.floor((Date.now() - ap._calcStart)/1000);
        const m = String(Math.floor(sec/60)).padStart(2,'0'), s = String(sec%60).padStart(2,'0');
        const e = $('#calcTimer'); if (e) e.textContent = `${m}:${s}`;
      }, 1000);
    }
  };

  // ================= 模块：错题 & 收藏夹 =================
  app.modules.mistakes = {
    tabs: {aptitude:'行测错题本', essay:'申论素材收藏夹', notices:'重点公告收藏夹'},
    render() {
      const tab = DB.data._mistakeTab || 'aptitude';
      if (tab === 'aptitude') return this.renderAptitude();
      if (tab === 'essay') return this.renderEssay();
      return this.renderNotices();
    },
    renderAptitude() {
      const ms = DB.data.mistakes;
      const sub = DB.data._mistakeSub || 'all';
      let list = ms.aptitude;
      if (sub !== 'all') list = list.filter(x => x.module === sub);
      const reasonStats = {};
      ms.aptitude.forEach(x => { reasonStats[x.reason] = (reasonStats[x.reason]||0)+1; });
      return `
        <div class="section-title">❤️ 错题 & 收藏夹 <small>行测错题本</small></div>
        <div class="card">
          ${app.tabs([{id:'all',name:'全部'},{id:'资料分析',name:'资料分析'},{id:'判断推理',name:'判断推理'},{id:'图形推理',name:'图形推理'},{id:'时政常识',name:'时政常识'}], sub)}
          <div class="flex gap-2 mb-2">
            <button class="btn btn-primary btn-sm" data-action="addMistakeApt">+ 手动录入</button>
            <button class="btn btn-success btn-sm" data-action="exportMistakeApt">导出错题</button>
            <button class="btn btn-warning btn-sm" data-action="weakSummary">薄弱考点汇总</button>
          </div>
          <div class="card" style="background:rgba(255,255,255,0.55)">
            <div class="card-title">📊 错因分布</div>
            <div class="flex gap-2 flex-wrap">
              ${Object.entries(reasonStats).map(([r,n]) => `<span class="tag tag-red">${r}: ${n}</span>`).join('') || '<span class="text-light text-sm">暂无统计</span>'}
            </div>
          </div>
          <div id="mistakeAptList">
            ${list.length ? list.map(m => this.aptCard(m)).join('') : '<div class="empty-state"><div class="emoji">📝</div>暂无错题，去刷题吧</div>'}
          </div>
        </div>
      `;
    },
    aptCard(m) {
      const levels = ['待复习','巩固中','已掌握'];
      return `<div class="item-card" data-id="${m.id}">
        <div class="item-title">${escape(m.title)} <span class="tag">${m.module}</span> <span class="tag tag-red">${m.reason}</span></div>
        <div class="item-content"><b>正确答案：</b>${escape(m.answer)}</div>
        <div class="item-meta">${escape(m.note||'')}</div>
        <div class="item-actions">
          <span class="tag ${['tag-red','tag-orange','tag-green'][m.level]}">${levels[m.level]}</span>
          <button class="btn btn-ghost btn-sm" data-action="levelMistake" data-l="0">待复习</button>
          <button class="btn btn-ghost btn-sm" data-action="levelMistake" data-l="1">巩固中</button>
          <button class="btn btn-ghost btn-sm" data-action="levelMistake" data-l="2">已掌握</button>
          <button class="btn btn-ghost btn-sm" data-action="redoMistake">重做</button>

          <button class="btn btn-danger btn-sm" data-action="deleteMistake">删除</button>
        </div>
      </div>`;
    },
    renderEssay() {
      const ms = DB.data.mistakes;
      let list = ms.essay;
      const q = DB.data._essayFavQ || '';
      if (q) list = list.filter(x => (x.title+x.content+x.tags.join('')).toLowerCase().includes(q.toLowerCase()));
      const types = {};
      list.forEach(x => { types[x.type] = (types[x.type]||0)+1; });
      return `
        <div class="section-title">❤️ 错题 & 收藏夹 <small>申论素材收藏夹</small></div>
        <div class="card">
          <div class="search-box"><input id="essayFavSearch" placeholder="搜索素材/标签/主题..." value="${q}"></div>
          <div class="flex gap-2 mb-2">
            <button class="btn btn-primary btn-sm" data-action="addEssayFav">+ 手动添加</button>
            <button class="btn btn-success btn-sm" data-action="exportEssayFav">批量导出</button>
          </div>

            ${Object.entries(types).map(([t,n]) => `<span class="tag tag-purple">${t}: ${n}</span>`).join('')}
          </div>

          <button class="btn btn-danger btn-sm" data-action="deleteEssayFav">删除</button>
        </div>
      </div>`;
    },
    renderNotices() {
      const ms = DB.data.mistakes;
      const list = ms.notices;

        <div class="section-title">❤️ 错题 & 收藏夹 <small>重点公告收藏夹</small></div>

            <button class="btn btn-ghost btn-sm" data-action="timelineNoticeFav">时间节点</button>
            <button class="btn btn-danger btn-sm" data-action="deleteNoticeFav">删除</button>
          `)).join('') : '<div class="empty-state"><div class="emoji">📌</div>暂无收藏公告</div>'}
        </div>
      `;

    afterRender() {

    },
    handle(action, el) {

      if (action === 'switchTab') return;

      if (action === 'addMistakeApt') {
        app.openModal('手动录入错题', `
          <input class="input mb-2" id="maTitle" placeholder="题干/标题">
          <input class="input mb-2" id="maModule" placeholder="模块 如 资料分析">
          <input class="input mb-2" id="maAnswer" placeholder="正确答案/解析">

        DB.save(); app.switchModule('mistakes'); return;

        const weak = {};
        ms.aptitude.filter(x => x.level < 2).forEach(x => { weak[x.module] = (weak[x.module]||0)+1; });
        app.openModal('薄弱考点汇总', Object.entries(weak).map(([k,v]) => `<p><b>${k}</b>：${v} 道待复习错题</p>`).join('') || '<p class="text-light">暂无薄弱考点</p>', `<button class="btn btn-primary" onclick="app.closeModal()">关闭</button>`); return;
      }

      if (action === 'addEssayFav') {
        app.openModal('添加申论素材', `
          <input class="input mb-2" id="efType" placeholder="类型 如 规范词收藏">
          <input class="input mb-2" id="efTitle" placeholder="标题">
          <textarea class="textarea mb-2" id="efContent" placeholder="内容"></textarea>
          <input class="input mb-2" id="efTags" placeholder="标签 空格分隔">
        `, `<button class="btn btn-primary" onclick="app.modules.mistakes.saveEssayFav()">保存</button>`); return;
      }
      if (action === 'deleteEssayFav') { const id = el.closest('[data-id]').dataset.id; ms.essay = ms.essay.filter(x => x.id !== id); DB.save(); app.switchModule('mistakes'); return; }
      if (action === 'tagEssayFav') {
        const id = el.closest('[data-id]').dataset.id; const m = ms.essay.find(x => x.id === id);
        app.openModal('添加标签', `<input class="input" id="efTags2" value="${escape(m.tags.join(' '))}">`, `<button class="btn btn-primary" onclick="app.modules.mistakes.saveTagsEssay('${id}')">保存</button>`); return;
      }
      if (action === 'noteEssayFav') {
        const id = el.closest('[data-id]').dataset.id; const m = ms.essay.find(x => x.id === id);
        app.openModal('批注', `<textarea class="textarea" id="efNote">${escape(m.note||'')}</textarea>`, `<button class="btn btn-primary" onclick="app.modules.mistakes.saveNoteEssay('${id}')">保存</button>`); return;
      }
      if (action === 'copyEssayFav') { const id = el.closest('[data-id]').dataset.id; const m = ms.essay.find(x => x.id === id); navigator.clipboard.writeText(m.content).then(()=>app.toast('已复制')); return; }
      if (action === 'exportEssayFav') {
        const txt = ms.essay.map(m => `[${m.type}] ${m.title}\n${m.content}\n标签：${m.tags.join(' ')}`).join('\n\n---\n\n');
        navigator.clipboard.writeText(txt).then(()=>app.toast('已复制到剪贴板')); return;
      }

      if (action === 'addNoticeFav') {
        app.openModal('添加公告收藏', `
          <input class="input mb-2" id="nfType" placeholder="考试类型">
          <input class="input mb-2" id="nfTitle" placeholder="公告名称">
          <input class="input mb-2" id="nfDate" type="date" value="${fmtDate()}">
          <textarea class="textarea" id="nfNote" placeholder="备注"></textarea>
        `, `<button class="btn btn-primary" onclick="app.modules.mistakes.saveNoticeFav()">保存</button>`); return;
      }
      if (action === 'deleteNoticeFav') { const id = el.closest('[data-id]').dataset.id; ms.notices = ms.notices.filter(x => x.id !== id); DB.save(); app.switchModule('mistakes'); return; }
      if (action === 'noteNoticeFav') {
        const id = el.closest('[data-id]').dataset.id; const m = ms.notices.find(x => x.id === id);
        app.openModal('备注', `<textarea class="textarea" id="nfNote2">${escape(m.note||'')}</textarea>`, `<button class="btn btn-primary" onclick="app.modules.mistakes.saveNoteNotice('${id}')">保存</button>`); return;
      }
      if (action === 'timelineNoticeFav') {
        const id = el.closest('[data-id]').dataset.id; const m = ms.notices.find(x => x.id === id);
        app.openModal('关键节点时间线', `
          <p><b>${escape(m.title)}</b></p>
          <p>公告发布：${m.date}</p>
          <p class="text-light">请手动补充报名、缴费、笔试等节点。</p>
        `, `<button class="btn btn-primary" onclick="app.closeModal()">关闭</button>`); return;
      }
      if (action === 'exportNoticeFav') {
        const txt = ms.notices.map(m => `[${m.type}] ${m.title}\n时间：${m.date}\n备注：${m.note||''}`).join('\n\n---\n\n');
        navigator.clipboard.writeText(txt).then(()=>app.toast('已复制到剪贴板')); return;
      }
    },
    saveMistakeApt() {
      DB.data.mistakes.aptitude.unshift({
        id: uuid(), module: $('#maModule').value, title: $('#maTitle').value,
        answer: $('#maAnswer').value, reason: $('#maReason').value, note: $('#maNote').value,
        date: fmtDate(), level: 0, history: []
      }); DB.save(); app.closeModal(); app.switchModule('mistakes');
    },
    saveNoteApt(id) {
      const m = DB.data.mistakes.aptitude.find(x => x.id === id); m.note = $('#maNote2').value;
      DB.save(); app.closeModal(); app.toast('批注已保存');
    },
    recordRedo(id, ok) {
      const m = DB.data.mistakes.aptitude.find(x => x.id === id); m.history.push({date: fmtDate(), ok});
      if (ok) m.level = Math.min(2, m.level + 1); else m.level = 0;
      DB.save(); app.closeModal(); app.switchModule('mistakes');
    },
    saveEssayFav() {
      DB.data.mistakes.essay.unshift({
        id: uuid(), type: $('#efType').value, title: $('#efTitle').value, content: $('#efContent').value,
        tags: $('#efTags').value.split(/\s+/).filter(Boolean), source: '手动添加', note: '', date: fmtDate(), favorite: true
      }); DB.save(); app.closeModal(); app.switchModule('mistakes');
    },
    saveTagsEssay(id) {
      const m = DB.data.mistakes.essay.find(x => x.id === id); m.tags = $('#efTags2').value.split(/\s+/).filter(Boolean);
      DB.save(); app.closeModal(); app.switchModule('mistakes');
    },
    saveNoteEssay(id) {
      const m = DB.data.mistakes.essay.find(x => x.id === id); m.note = $('#efNote').value;
      DB.save(); app.closeModal(); app.toast('批注已保存');
    },
    saveNoticeFav() {
      DB.data.mistakes.notices.unshift({
        id: uuid(), type: $('#nfType').value, title: $('#nfTitle').value, date: $('#nfDate').value, note: $('#nfNote').value, favorite: true
      }); DB.save(); app.closeModal(); app.switchModule('mistakes');
    },
    saveNoteNotice(id) {
      const m = DB.data.mistakes.notices.find(x => x.id === id); m.note = $('#nfNote2').value;
      DB.save(); app.closeModal(); app.toast('备注已保存');
    }
  };



  // ================= 模块：联网学习中心（纯前端） =================
  // ===== API 固定配置区：只需要在电脑上改这里 3 项，然后重新上传 GitHub =====
  // 注意：这是纯前端方案，部署后访问网页的人可以在源码中看到 API Key。
  const HARD_CODED_API_CONFIG = {
    apiBase: 'https://api.deepseek.com/v1',
    apiKey: 'sk-cda713e72f7f4ae0ae7cd2977bc71314',
    model: 'deepseek-chat',
    temperature: 0.3,
    newsQuery: '公务员 时政 政策 会议 site:gov.cn OR site:news.cn OR site:people.com.cn'
  };

  app.modules.network = {
    getSettings() {
      return { ...HARD_CODED_API_CONFIG };
    },
    render() {
      const st = this.getSettings();
      return `
        <div class="section-title">🌐 联网学习中心 <small>纯前端 · GitHub Pages 可直接使用</small></div>
        <div class="card net-hero">
          <div class="card-title">🚀 实时学习增强</div>
          <div class="net-warning">时政标题通过公开新闻 RSS 联网检索；AI 用你自己的 OpenAI-compatible 接口。AI 接口已经改为代码内固定配置；电脑修改并部署一次后，iPad 无需再次填写 API。</div>
          <div class="net-row" style="margin-top:12px">
            <button class="btn btn-primary" data-action="newsSearch">📰 刷新最新时政</button>
            <button class="btn btn-success" data-action="testAI">🧪 测试 AI 连接</button>
            <button class="btn btn-ghost" data-action="externalGovSearch">🏛️ 中国政府网搜索</button>
            <button class="btn btn-ghost" data-action="externalPeopleSearch">🔎 人民网搜索</button>
          </div>
        </div>

        <div class="net-grid">
          <div class="card">
            <div class="card-title">📰 实时时政检索</div>
            <div class="net-row">
              <input class="input" id="netNewsQuery" value="${escape(st.newsQuery)}" placeholder="例如：国务院 人工智能 政策">
              <button class="btn btn-primary btn-sm" data-action="newsSearch">搜索</button>
            </div>
            <div class="net-status">默认优先检索 gov.cn / 新华网 / 人民网相关内容。若代理服务临时不可用，可稍后重试或点击官方搜索。</div>
            <div id="netNewsStatus"></div>
            <div id="netNewsResults"></div>
          </div>

          <div class="card">
            <div class="card-title">📖 联网/AI 成语助手</div>
            <div class="net-row">
              <input class="input" id="netIdiomWord" placeholder="输入成语，如：缘木求鱼">
              <button class="btn btn-primary btn-sm" data-action="aiIdiom">AI 解析</button>
            </div>
            <div class="net-row" style="margin-top:8px">
              <button class="btn btn-ghost btn-sm" data-action="baiduIdiom">百度检索</button>
              <button class="btn btn-ghost btn-sm" data-action="peopleIdiom">人民网例句</button>
              <button class="btn btn-success btn-sm" data-action="saveAiIdiom">保存到成语库</button>
            </div>
            <div class="net-ai-output" id="netIdiomOutput">输入成语后点击“AI 解析”，可生成释义、易错点、近义辨析、例句和行测考法。</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">🤖 AI 考公助教</div>
          <textarea class="textarea" id="netAiQuestion" rows="4" placeholder="例如：请把今天的时政整理成10个行测常识考点；或解释某项政策的申论意义。"></textarea>
          <div class="net-row" style="margin-top:10px">
            <button class="btn btn-primary" data-action="askAI">发送给 AI</button>
            <button class="btn btn-ghost" data-action="clearAI">清空</button>
          </div>
          <div class="net-ai-output" id="netAiOutput">AI 回答会显示在这里。</div>
        </div>
      `;
    },
    handle(action) {
      if (action === 'newsSearch') return this.searchNews();
      if (action === 'testAI') return this.testAI();
      if (action === 'externalGovSearch') return this.openSearch('https://www.google.com/search?q=', ($('#netNewsQuery')?.value || '时政') + ' site:gov.cn');
      if (action === 'externalPeopleSearch') return this.openSearch('https://www.google.com/search?q=', ($('#netNewsQuery')?.value || '时政') + ' site:people.com.cn');
      if (action === 'baiduIdiom') return this.openSearch('https://www.baidu.com/s?wd=', ($('#netIdiomWord')?.value || '') + ' 成语 释义');
      if (action === 'peopleIdiom') return this.openSearch('https://www.google.com/search?q=', 'site:people.com.cn "' + ($('#netIdiomWord')?.value || '') + '"');
      if (action === 'aiIdiom') return this.aiIdiom();
      if (action === 'saveAiIdiom') return this.saveAiIdiom();
      if (action === 'askAI') return this.askAI();
      if (action === 'clearAI') { const o=$('#netAiOutput'); if(o)o.textContent='AI 回答会显示在这里。'; const q=$('#netAiQuestion'); if(q)q.value=''; return; }
      if (action === 'importLiveNews') return this.importLiveNews(Number(event?.target?.closest('[data-idx]')?.dataset.idx));
      if (action === 'analyzeLiveNews') return this.analyzeLiveNews(Number(event?.target?.closest('[data-idx]')?.dataset.idx));
    },
    openSearch(prefix, q) { if (!q.trim()) { app.toast('请输入关键词'); return; } window.open(prefix + encodeURIComponent(q), '_blank'); },
    async testAI() {
      try {
        const x=await this.callAI('只回复“连接成功”。');
        app.toast(x ? 'AI 连接成功' : '连接返回为空');
      } catch(e) {
        app.toast('连接失败：'+e.message.slice(0,100));
      }
    },
    async callAI(prompt, system='你是一名严谨的中国公务员考试学习助教。答案清晰、准确、避免编造；涉及最新事实时提醒用户以原始来源为准。') {
      const st=this.getSettings();
      if(!st.apiKey || st.apiKey === '请把你的API_KEY填写在这里') throw new Error('请先在 index.html 顶部 HARD_CODED_API_CONFIG 中填写 API Key');
      if(!st.apiBase || !st.model) throw new Error('请检查 HARD_CODED_API_CONFIG 中的 API Base URL 和模型名');
      const url=st.apiBase.replace(/\/$/,'') + '/chat/completions';
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.apiKey},body:JSON.stringify({model:st.model,messages:[{role:'system',content:system},{role:'user',content:prompt}],temperature:Number(st.temperature)||0.3})});
      const txt=await res.text();
      if(!res.ok) throw new Error('HTTP '+res.status+' '+txt.slice(0,180));
      let data; try{data=JSON.parse(txt)}catch(e){throw new Error('接口返回不是 JSON')}
      return data?.choices?.[0]?.message?.content || data?.choices?.[0]?.text || '';
    },
    async fetchTextWithProxy(url) {
      const tries=[
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];
      let last='';
      for(const u of tries){
        try{const r=await fetch(u,{mode:'cors',cache:'no-store'}); if(r.ok){const t=await r.text(); if(t && t.length>80)return t;} last='HTTP '+r.status;}catch(e){last=e.message}
      }
      throw new Error(last || '公开代理暂时不可用');
    },
    async searchNews() {
      const q=($('#netNewsQuery')?.value || this.getSettings().newsQuery).trim();
      if(!q){app.toast('请输入时政关键词');return;}
      const st=this.getSettings(); st.newsQuery=q; this.saveSettingsObject(st);
      const status=$('#netNewsStatus'), out=$('#netNewsResults');
      if(status) status.innerHTML='<div class="net-status">⏳ 正在联网检索最新新闻...</div>';
      if(out) out.innerHTML='';
      try{
        const rss='https://www.bing.com/news/search?q='+encodeURIComponent(q)+'&format=rss&setlang=zh-cn';
        const text=await this.fetchTextWithProxy(rss);
        const xml=new DOMParser().parseFromString(text,'application/xml');
        const nodes=Array.from(xml.querySelectorAll('item')).slice(0,12);
        if(!nodes.length) throw new Error('未解析到 RSS 新闻');
        this._liveNews=nodes.map(n=>({
          title:n.querySelector('title')?.textContent?.trim()||'无标题',
          link:n.querySelector('link')?.textContent?.trim()||'',
          desc:(n.querySelector('description')?.textContent||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
          date:n.querySelector('pubDate')?.textContent||'',
          source:n.querySelector('source')?.textContent||''
        }));
        if(status) status.innerHTML='<div class="net-status">✅ 获取 '+this._liveNews.length+' 条。新闻会随联网检索结果变化。</div>';
        if(out) out.innerHTML=this._liveNews.map((n,i)=>`<div class="net-result" data-idx="${i}"><div class="net-result-title">${escape(n.title)}</div><div class="net-result-meta">${escape(n.source||'网络来源')} · ${escape(n.date||'')}</div><div class="net-result-desc">${escape(n.desc.slice(0,220))}</div><div class="net-row" style="margin-top:8px"><button class="btn btn-success btn-sm" onclick="app.modules.network.importLiveNews(${i})">保存到时政库</button><button class="btn btn-primary btn-sm" onclick="app.modules.network.analyzeLiveNews(${i})">AI提炼考点</button>${n.link?`<button class="btn btn-ghost btn-sm" onclick="window.open('${escape(n.link)}','_blank')">查看原文</button>`:''}</div></div>`).join('');
      }catch(e){ if(status) status.innerHTML='<div class="net-status" style="color:#FF6B6B">❌ '+escape(e.message)+'。可稍后重试，或使用上方官方搜索按钮。</div>'; }
    },
    importLiveNews(i) {
      const n=(this._liveNews||[])[i]; if(!n){app.toast('新闻条目不存在');return;}
      const exists=DB.data.currentAffairs.items.some(x=>x.title===n.title);
      if(exists){app.toast('这条已经保存过了');return;}
      DB.data.currentAffairs.items.unshift({id:uuid(),cat:'daily',title:n.title,content:n.desc.slice(0,160)||'点击查看原文',full:escape(n.desc)+(n.link?`<br><br><a href="${escape(n.link)}" target="_blank" style="color:var(--accent-blue)">查看原文 →</a>`:''),date:fmtDate(n.date||new Date()),read:false,favorite:false,highlight:'',note:'来源：'+(n.source||'联网检索')});
      DB.save(); app.toast('已保存到“每日时政速览”');
    },
    async analyzeLiveNews(i) {
      const n=(this._liveNews||[])[i]; if(!n){app.toast('新闻条目不存在');return;}
      const out=$('#netAiOutput'); if(out)out.textContent='⏳ 正在提炼考点...';
      try{
        const ans=await this.callAI(`请根据下面这条新闻（只基于给出的标题和摘要）整理公务员考试学习笔记：\n标题：${n.title}\n摘要：${n.desc}\n来源：${n.source}\n\n按以下格式输出：1.核心事实 2.行测常识考点 3.申论主题与角度 4.三个可能的选择题考法 5.一句背诵口诀。不要补造摘要中没有的具体数字。`);
        if(out)out.textContent=ans;
      }catch(e){if(out)out.textContent='❌ '+e.message;}
    },
    async aiIdiom() {
      const word=($('#netIdiomWord')?.value||'').trim(); const out=$('#netIdiomOutput');
      if(!word){app.toast('请输入成语');return;}
      if(out)out.textContent='⏳ 正在解析...';
      try{
        const ans=await this.callAI(`请解析成语“${word}”，面向公务员行测言语理解备考。严格按以下格式：\n释义：\n感情色彩：\n适用对象/语境：\n常见误用：\n近义成语辨析：\n反义成语：\n例句1：\n例句2：\n行测考法：\n记忆口诀：`,'你是严谨的汉语成语学习助教。对词义、褒贬色彩和使用对象要谨慎；不确定时明确说明。');
        this._lastIdiom={word,answer:ans}; if(out)out.textContent=ans;
      }catch(e){if(out)out.textContent='❌ '+e.message;}
    },
    saveAiIdiom() {
      const x=this._lastIdiom; if(!x){app.toast('请先 AI 解析一个成语');return;}
      const lines=x.answer.split(/\n+/).map(v=>v.trim()).filter(Boolean);
      const get=(k)=>{const z=lines.find(v=>v.startsWith(k));return z?z.slice(k.length).trim():''};
      const meaning=get('释义：')||x.answer.slice(0,180);
      const sents=[get('例句1：'),get('例句2：')].filter(Boolean);
      const arr=DB.data.aptitude.questions.idiom;
      const old=arr.find(v=>v.word===x.word);
      if(old){old.meaning=meaning; if(sents.length)old.sentences=sents; old.group=get('近义成语辨析：')||old.group;}
      else arr.unshift({id:uuid(),word:x.word,meaning,sentences:sents,group:get('近义成语辨析：')||'',freq:0,level:0,favorite:false});
      DB.save(); app.toast(old?'已更新成语库':'已加入成语库');
    },
    async askAI() {
      const q=($('#netAiQuestion')?.value||'').trim(); const out=$('#netAiOutput');
      if(!q){app.toast('请输入问题');return;}
      if(out)out.textContent='⏳ AI 正在回答...';
      try{const a=await this.callAI(q); if(out)out.textContent=a;}catch(e){if(out)out.textContent='❌ '+e.message;}
    }
  };

  app.init();
})();
</script>
